name: build-crosvm-panvk

# Android arm64 crosvm for the PanVK/Mali native-context VM, built from
# collegeming/crosvm panvk-nctx-blobfix (host-visible blob BAR mapping fix).
# The virglrenderer shipped in the same artifact is the Mali kbase fork built
# by scripts/host-ndk/build-host-ndk.sh, so crosvm is linked against exactly
# the backend it runs with.

on:
  workflow_dispatch:
    inputs:
      crosvm_ref:
        description: crosvm ref to build
        required: false
        default: panvk-nctx-blobfix
  push:
    branches: [ci/crosvm-panvk]
    paths:
      - '.github/workflows/build-crosvm-panvk.yml'

permissions:
  contents: read

concurrency:
  group: crosvm-panvk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CROSVM_REPOSITORY: collegeming/crosvm
      CROSVM_REF: ${{ github.event.inputs.crosvm_ref || 'panvk-nctx-blobfix' }}
      MINIJAIL_COMMIT: 8330e01d0fd55dfe505890eb5f829b77ac4ca8cb
      RUSTUP_TOOLCHAIN: 1.90.0
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '4'
      CROSVM_USE_SYSTEM_VIRGLRENDERER: '1'
      CROSVM_USE_SYSTEM_MINIGBM: '1'
      PKG_CONFIG_ALLOW_CROSS: '1'
    steps:
      - name: Checkout CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout crosvm
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CROSVM_REPOSITORY }}
          ref: ${{ env.CROSVM_REF }}
          path: source
          persist-credentials: false

      - name: Preserve mapper state until unregister succeeds
        run: |
          set -eux
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source/devices/src/virtio/virtio_pci_device.rs')
          s = p.read_text()
          old = 'if let Some(old_id) = self.mappings.remove(&offset) {'
          assert s.count(old) == 2
          s = s.replace(old, 'if let Some(old_id) = self.mappings.get(&offset).copied() {')
          old = '.context("unregister_memory of replaced mapping failed")?;'
          assert s.count(old) == 2
          s = s.replace(old, old + '\n            self.mappings.remove(&offset);')
          old = '''        let id = self.mappings.remove(&offset).context("invalid offset")?;
                  self.vm_memory_client
                      .unregister_memory(id)
                      .context("unregister_memory failed")'''
          new = '''        let id = self.mappings.get(&offset).copied().context("invalid offset")?;
                  self.vm_memory_client
                      .unregister_memory(id)
                      .with_context(|| format!("unregister_memory failed at BAR offset {:#x}", offset))?;
                  self.mappings.remove(&offset);
                  Ok(())'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          p = Path('source/devices/src/virtio/gpu/virtio_gpu.rs')
          s = p.read_text()
          import re
          pattern = r'(\.remove_mapping\(shmem_offset\)\s*)\.map_err\(\|_\| ErrUnspec\)\?;'
          s, count = re.subn(pattern, lambda m: m[1] + '''.map_err(|e| {
                              base::error!("PANVK-UNMAP: resource={} offset={:#x} error={:#}", resource_id, shmem_offset, e);
                              ErrUnspec
                          })?;''', s)
          assert count == 2, count
          old = '''        if resource.persist_offset.take().is_some() {
                      return Ok(OkNoData);
                  }'''
          new = '''        if resource.persist_offset.is_some() {
                      // The stable page belongs to the VM, not this resource. Keep the
                      // marker until UNREF so it cannot unregister a later user's page.
                      resource.shmem_offset = None;
                      return Ok(OkNoData);
                  }'''
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = 'if size <= 65536 && resource.blob_id == 0 {'
          assert s.count(old) == 1
          s = s.replace(old, 'if !self.fixed_blob_mapping && size <= 65536 && resource.blob_id == 0 {')
          old = '            let queryable = rutabaga.query(resource.resource_id).is_ok();'
          new = '''            // Native-context BOs contain the actual GPU-written linear scanout.
                      // Virgl's successful export query does not make transfer_read valid.
                      let native_blob = resource.blob_id != 0
                          && std::env::var_os("VKR_TEST_KBASE_NATIVE").is_some();
                      let queryable = !native_blob && rutabaga.query(resource.resource_id).is_ok();'''
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = '''            } else {
                          source = Some(VmMemorySource::Descriptor {
                              descriptor,
                              offset: 0,
                              size,
                          });
                      }
                  }

                  let res_size = resource.size;'''
          new = '''            } else {
                          if resource.blob_id != 0 && std::env::var_os("VKR_TEST_KBASE_NATIVE").is_some() {
                              resource.backend_fd = descriptor.try_clone().ok();
                          }
                          source = Some(VmMemorySource::Descriptor {
                              descriptor,
                              offset: 0,
                              size,
                          });
                      }
                  }

                  let res_size = resource.size;'''
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = '            if resource.scanout_blob_map.is_none() && !queryable {'
          new = '''            if native_blob && resource.scanout_blob_map.is_none() {
                          if let Some(ref fd) = resource.backend_fd {
                              let data = resource.scanout_data.unwrap();
                              let length = (data.strides[0] as u64)
                                  .checked_mul(data.height as u64)
                                  .and_then(|v| v.checked_add(data.offsets[0] as u64))
                                  .ok_or(ErrUnspec)?;
                              if length > resource.size { return Err(ErrUnspec); }
                              resource.scanout_blob_map = Some(
                                  MemoryMappingBuilder::new(length as usize).from_descriptor(fd)
                                      .build().map_err(|_| ErrUnspec)?);
                              note_flush_route("blob: native-context retained descriptor mapped");
                          }
                      }
                      if resource.scanout_blob_map.is_none() && !queryable {'''
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = '''                let outcome = display.present_frame(surface_id, &frame);
                          strace!("flush.blob.copy.end");'''
          new = '''                let outcome = display.present_frame(surface_id, &frame);
                          if native_blob {
                              static PROBES: std::sync::atomic::AtomicUsize = std::sync::atomic::AtomicUsize::new(0);
                              let n = PROBES.fetch_add(1, std::sync::atomic::Ordering::Relaxed);
                              if n < 12 {
                                  let sample = &src[src_offset.min(src.len())..];
                                  let nonzero = sample.iter().step_by(4093).filter(|b| **b != 0).count();
                                  base::warn!("PANVK-PRESENT: res={} blob={} bytes={} stride={} format={:#x} sample_nonzero={} flipped={}",
                                      resource.resource_id, resource.blob_id, sample.len(), src_stride,
                                      data.drm_format.0, nonzero, matches!(outcome, PresentOutcome::Flipped));
                              }
                          }
                          strace!("flush.blob.copy.end");'''
          assert s.count(old) == 1
          s = s.replace(old, new)
          p.write_text(s)
          p = Path('source/src/crosvm/sys/linux.rs')
          s = p.read_text()
          old = '#[cfg(feature = "vnc")]\nmod simplefb_display;'
          assert s.count(old) == 1
          p.write_text(s.replace(old, '#[cfg(any(feature = "vnc", feature = "android_display"))]\nmod simplefb_display;'))
          p = Path('source/src/crosvm/sys/linux/simplefb_display.rs')
          s = p.read_text()
          for old, new in [
              ('    Vnc {\n', '    #[cfg(feature = "vnc")]\n    Vnc {\n'),
              ('                SimplefbDisplayTarget::Vnc {\n', '                #[cfg(feature = "vnc")]\n                SimplefbDisplayTarget::Vnc {\n'),
          ]:
              assert s.count(old) == 1, old
              s = s.replace(old, new)
          p.write_text(s)
          PY
          git -C source diff --check
          mkdir -p out
          git -C source diff > out/panvk-mapper-retry.patch

      - name: Checkout minijail
        uses: actions/checkout@v4
        with:
          repository: google/minijail
          ref: ${{ env.MINIJAIL_COMMIT }}
          path: minijail
          persist-credentials: false

      - name: Checkout libcap
        uses: actions/checkout@v4
        with:
          repository: mhiramat/libcap
          ref: 8c67abc3f5cfa8310dae21e5db464fd990cb71a2
          path: libcap-source
          persist-credentials: false

      - name: Checkout libffi
        uses: actions/checkout@v4
        with:
          repository: libffi/libffi
          ref: 3d0ce1e6fcf19f853894862abcbac0ae78a7be60
          path: libffi-source
          persist-credentials: false

      - name: Checkout wayland
        uses: actions/checkout@v4
        with:
          repository: wayland-mirror/wayland
          ref: b2649cb3ee6bd70828a17e50beb16591e6066288
          path: wayland-source
          persist-credentials: false

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source -> target
          key: crosvm-panvk-v2
          cache-on-failure: true

      - name: Record source pin
        run: |
          set -eux
          git -C source rev-parse HEAD | tee source-commit.txt
          git -C source log -1 --oneline
          test -f source/third_party/minijail/rust/minijail/Cargo.toml
          test "$(git -C minijail rev-parse HEAD)" = "$MINIJAIL_COMMIT"

      - name: Install build tools and Android toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config libclang-dev \
            libwayland-dev wayland-protocols libcap-dev \
            autoconf automake libtool
          mkdir -p work out
          if [ ! -f work/android-ndk-r27c-linux.zip ]; then
            curl -fsSL --retry 3 -o work/android-ndk-r27c-linux.zip \
              https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          fi
          printf '%s  %s\n' 090e8083a715fdb1a3e402d0763c388abb03fb4e work/android-ndk-r27c-linux.zip | sha1sum -c -
          if [ ! -d work/ndk/android-ndk-r27c ]; then
            unzip -q work/android-ndk-r27c-linux.zip -d work/ndk
          fi
          NDK="$PWD/work/ndk/android-ndk-r27c"
          grep -q '27.2.12479018' "$NDK/source.properties"
          printf 'ANDROID_NDK_HOME=%s\nTC=%s\n' "$NDK" "$NDK/toolchains/llvm/prebuilt/linux-x86_64" >> "$GITHUB_ENV"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal \
            --target aarch64-linux-android --target aarch64-unknown-none-softfloat
          rustup target add --toolchain "$RUSTUP_TOOLCHAIN" aarch64-unknown-none-softfloat
          rustc +"$RUSTUP_TOOLCHAIN" --version

      - name: Build host virglrenderer (Mali kbase fork, NDK)
        run: bash scripts/host-ndk/build-host-ndk.sh

      - name: Create virglrenderer pkg-config
        shell: bash
        run: |
          set -euxo pipefail
          VIRGL="$PWD/work/virglrenderer-e58441fc6fa6ce73e6545882b43c8c807fe22a11"
          test -f "$VIRGL/src/virglrenderer.h"
          test -f "$PWD/out/libvirglrenderer.so"
          mkdir -p native-prefix/lib/pkgconfig
          cat > native-prefix/lib/pkgconfig/virglrenderer.pc <<EOF
          prefix=$VIRGL
          libdir=$PWD/out
          includedir=\${prefix}/src

          Name: virglrenderer
          Description: virglrenderer (Mali kbase native-context fork)
          Version: 1.0.0
          Libs: -L\${libdir} -lvirglrenderer
          Cflags: -I\${includedir}
          EOF
          cat native-prefix/lib/pkgconfig/virglrenderer.pc
          PKG_CONFIG_PATH="$PWD/native-prefix/lib/pkgconfig" pkg-config --modversion virglrenderer --libs --cflags

      - name: Build Android native libraries and headers
        shell: bash
        run: |
          set -euxo pipefail
          PREFIX="$PWD/native-prefix"
          mkdir -p native-libs native-headers/sys
          export CC="$TC/bin/aarch64-linux-android33-clang"
          export CXX="$TC/bin/aarch64-linux-android33-clang++"
          export AR="$TC/bin/llvm-ar"
          export RANLIB="$TC/bin/llvm-ranlib"
          make -C libcap-source/libcap -j4 libcap.a CC="$CC" BUILD_CC=gcc BUILD_CFLAGS=-O2 AR="$AR" RANLIB="$RANLIB" BUILD_GPERF=no
          cp libcap-source/libcap/libcap.a native-libs/
          cp /usr/include/sys/capability.h native-headers/sys/
          cp /usr/include/wayland*.h native-headers/
          BUILTINS="$($CC -print-libgcc-file-name)"
          test -f "$BUILTINS"
          cp "$BUILTINS" native-libs/libndk-builtins.a
          mkdir -p downloads/libffi extracted/libffi
          if [ ! -f downloads/libffi/libffi.tar.gz ]; then
            curl -fsSL --retry 3 -o downloads/libffi/libffi.tar.gz \
              https://github.com/libffi/libffi/releases/download/v3.4.6/libffi-3.4.6.tar.gz
          fi
          printf '%s  %s\n' b0dea9df23c863a7a50e825440f3ebffabd65df1497108e5d437747843895a4e downloads/libffi/libffi.tar.gz | sha256sum -c -
          tar -xf downloads/libffi/libffi.tar.gz -C extracted/libffi
          mkdir -p libffi-build
          (cd libffi-build && ../extracted/libffi/libffi-3.4.6/configure --host=aarch64-linux-android --prefix="$PREFIX" --disable-shared --enable-static --with-pic && make -j4 && make install)
          printf "[binaries]\nc = '%s'\ncpp = '%s'\nar = '%s'\nstrip = '%s'\npkg-config = '/usr/bin/pkg-config'\n[properties]\npkg_config_libdir = '%s/lib/pkgconfig'\n[host_machine]\nsystem = 'android'\ncpu_family = 'aarch64'\ncpu = 'aarch64'\nendian = 'little'\n" "$CC" "$CXX" "$AR" "$TC/bin/llvm-strip" "$PREFIX" > wayland-cross.ini
          meson setup wayland-build wayland-source --cross-file wayland-cross.ini --prefix "$PREFIX" --default-library static -Dscanner=false -Dtests=false -Ddocumentation=false -Ddtd_validation=false
          ninja -C wayland-build src/libwayland-client.a
          cp wayland-build/src/libwayland-client.a "$PREFIX/lib/libffi.a" native-libs/
          ls -l native-libs native-headers

      - name: Build DroidVM Gunyah boot shim
        shell: bash
        run: |
          set -euxo pipefail
          ( cd source/droidvm-shim && cargo +"$RUSTUP_TOOLCHAIN" build --release --target aarch64-unknown-none-softfloat )
          "$TC/bin/llvm-objcopy" -O binary \
            source/droidvm-shim/target/aarch64-unknown-none-softfloat/release/droidvm-shim \
            source/hypervisor/src/gunyah/shim.bin
          ls -l source/hypervisor/src/gunyah/shim.bin

      - name: Patch crosvm for stub-free Android NDK build
        shell: bash
        run: |
          set -euxo pipefail
          python3 -I - <<'PY'
          import re
          from pathlib import Path

          def sub(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              assert s.count(old) == count, (path, s.count(old), old[:80])
              p.write_text(s.replace(old, new))

          # The fork carries rand 0.9 calls while Cargo.lock pins rand 0.8.
          sub('source/devices/src/virtio/rng.rs', 'rand::rng()', 'rand::thread_rng()')
          sub('source/aarch64/src/fdt.rs', 'rand::rng()', 'rand::thread_rng()', 2)

          # Only reached from the audio-gated constructor; keep it out of a build
          # that has no virtio-snd at all.
          p = Path('source/src/crosvm/sys/linux/device_helpers.rs')
          s = p.read_text()
          old = '/// See `snd_helper` for why the backend cannot simply stay here.\nfn create_unprivileged_virtio_snd_device('
          assert s.count(old) == 1
          p.write_text(s.replace(old, '/// See `snd_helper` for why the backend cannot simply stay here.\n#[cfg(feature = "audio")]\nfn create_unprivileged_virtio_snd_device('))

          # libprocessgroup is a platform library, not an NDK stub one. Resolve it
          # at runtime, and only when task profiles are actually requested.
          p = Path('source/src/crosvm/sys/linux/android.rs')
          s = p.read_text()
          start = s.index('#[link(name = "processgroup")]')
          end = s.index('// Apply the listed task profiles', start)
          s = s[:start] + s[end:]
          old = '    let owned: Vec<CString> = profiles'
          assert s.count(old) == 1
          s = s.replace(old, '''    // Standalone NDK binaries must resolve this optional platform API at runtime.
              // Empty profiles retain their existing early return; requested profiles fail closed.
              let handle = unsafe { libc::dlopen(b"libprocessgroup.so\\0".as_ptr().cast(), libc::RTLD_NOW | libc::RTLD_LOCAL) };
              if handle.is_null() {
                  return Err(anyhow!("libprocessgroup.so unavailable for requested task profiles"));
              }
              let symbol = unsafe { libc::dlsym(handle, b"android_set_process_profiles\\0".as_ptr().cast()) };
              if symbol.is_null() {
                  unsafe { libc::dlclose(handle); }
                  return Err(anyhow!("android_set_process_profiles unavailable for requested task profiles"));
              }
              type SetProfiles = unsafe extern "C" fn(libc::uid_t, libc::pid_t, libc::size_t, *const *const libc::c_char) -> bool;
              let android_set_process_profiles: SetProfiles = unsafe { std::mem::transmute(symbol) };
          ''' + old)
          old = '        if android_set_process_profiles(libc::getuid(), libc::getpid(), ptrs.len(), ptrs.as_ptr()) {'
          assert s.count(old) == 1
          s = s.replace(old, '        let success = android_set_process_profiles(libc::getuid(), libc::getpid(), ptrs.len(), ptrs.as_ptr());\n        libc::dlclose(handle);\n        if success {')
          p.write_text(s)

          # __android_log_close is not in the NDK stub liblog. Children log to
          # stderr through the public logger API instead of inheriting a dead socket.
          p = Path('source/base/src/sys/linux/android/syslog.rs')
          s = p.read_text()
          old = '    fn __android_log_close();'
          assert s.count(old) == 1
          s = s.replace(old, '    fn __android_log_set_logger(logger: Option<unsafe extern "C" fn(*const __android_log_message)>);\n    fn __android_log_stderr_logger(message: *const __android_log_message);')
          old = '        unsafe { __android_log_close() };'
          assert s.count(old) == 1
          s = s.replace(old, '        // Public API30+: child logs use stderr, never the stale inherited logd socket.\n        unsafe { __android_log_set_logger(Some(__android_log_stderr_logger)) };')
          p.write_text(s)

          # No libwayland-client.so on an Android target: link the real static
          # archive (and its private deps) built in the previous step.
          sub('source/gpu_display/build.rs',
              'println!("cargo:rustc-link-lib=dylib=wayland-client");',
              'println!("cargo:rustc-link-lib=static=wayland-client");\n    println!("cargo:rustc-link-lib=static=ffi");\n    println!("cargo:rustc-link-lib=static=ndk-builtins");')

          # minijail-sys invents a GCC prefix; point its make at the genuine NDK
          # tools and build only the static archive the Rust crate links.
          p = Path('minijail/rust/minijail-sys/build.rs')
          s = p.read_text()
          old = '.env("BUILD_STATIC_LIBS", "yes")'
          assert s.count(old) == 1
          s = s.replace(old, old + '\n            .env("CC", std::env::var("CC_aarch64_linux_android").unwrap())\n            .env("CXX", std::env::var("CXX_aarch64_linux_android").unwrap())\n            .env("AR", std::env::var("AR_aarch64_linux_android").unwrap())\n            .env("CPPFLAGS", format!("-I{}/native-headers", std::env::var("GITHUB_WORKSPACE").unwrap()))\n            .arg("CC_STATIC_LIBRARY(libminijail.pic.a)")')
          p.write_text(s)

          print('patches applied')
          PY

      - name: Build the DroidVM Android display client for android_display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y aria2
          mkdir -p downloads
          # gpu_display's android_display backend calls the libcrosvm_android_display_client ABI.
          # Cargo has no rule for it, so compile the pinned DroidVM/AOSP client and its NDK AIDL
          # glue here, then link the archive into crosvm.
          CLIENT_SHA=862c6af544ce4ca89e5dc8f1aca10a832367d77f
          FWN_SHA=c44a9120035161a7297f0be722f991f8995d522b
          FWB_SHA=41aed9f8e0aea35a5b4cda5e2575eee6f2cc9238
          SYSCORE_SHA=322ff5129d865a5e8d958667e6c63ac943449493
          LIBBASE_SHA=7e57da991ea477f247e5a714f3a83e8af8341791
          CL="$GITHUB_WORKSPACE/native-display-client"
          test ! -e "$CL"
          mkdir -p "$CL/src" "$CL/aidl/android/view" "$CL/aidl/android/os" "$CL/aidl/android/crosvm" \
            "$CL/include/system" "$CL/include/vndk" "$CL/include/apex" "$CL/include/nativebase" \
            "$CL/include/cutils" "$CL/include/android" "$CL/include/android-base" \
            "$CL/obj" "$CL/aidl-out" "$CL/aidl-hdr" "$CL/linkstubs"
          raw="https://raw.githubusercontent.com"
          fetch() { aria2c -q -x8 -s8 --allow-overwrite=true -d "$(dirname "$2")" -o "$(basename "$2")" "$1"; }
          for f in crosvm_android_display_client.cpp media_codec_dl.cpp media_codec_dl.h \
                   media_codec_abi.h surface_control_dl.cpp surface_control_dl.h surface_control_abi.h; do
            fetch "$raw/Droid-VM/Virtualization/$CLIENT_SHA/libs/android_display_backend/$f" "$CL/src/$f"
          done
          fetch "$raw/Droid-VM/Virtualization/$CLIENT_SHA/libs/android_display_backend/aidl/android/crosvm/ICrosvmAndroidDisplayService.aidl" "$CL/aidl/android/crosvm/ICrosvmAndroidDisplayService.aidl"
          fetch "$raw/Droid-VM/Virtualization/$CLIENT_SHA/libs/android_display_backend/aidl/android/crosvm/DisplayConfig.aidl" "$CL/aidl/android/crosvm/DisplayConfig.aidl"
          fetch "$raw/GrapheneOS/platform_frameworks_native/$FWN_SHA/aidl/gui/android/view/Surface.aidl" "$CL/aidl/android/view/Surface.aidl"
          fetch "$raw/phhusson/platform_frameworks_base/$FWB_SHA/core/java/android/os/ParcelFileDescriptor.aidl" "$CL/aidl/android/os/ParcelFileDescriptor.aidl"
          for p in libs/nativewindow/include/system/window.h libs/nativewindow/include/vndk/window.h \
                   libs/nativewindow/include/vndk/hardware_buffer.h libs/nativewindow/include/apex/window.h \
                   libs/nativebase/include/nativebase/nativebase.h \
                   libs/binder/ndk/include_platform/android/binder_manager.h \
                   libs/binder/ndk/include_platform/android/binder_process.h; do
            fetch "$raw/GrapheneOS/platform_frameworks_native/$FWN_SHA/$p" "$CL/include/${p#libs/*/include*/}"
          done
          for p in libcutils/include/cutils/native_handle.h libsystem/include/system/graphics.h \
                   libsystem/include/system/graphics-base.h libsystem/include/system/graphics-base-v1.0.h \
                   libsystem/include/system/graphics-base-v1.1.h libsystem/include/system/graphics-base-v1.2.h \
                   libsystem/include/system/graphics-sw.h; do
            fetch "$raw/GrapheneOS/platform_system_core/$SYSCORE_SHA/$p" "$CL/include/${p#lib*/include/}"
          done
          for f in errors.h expected.h result.h scopeguard.h no_destructor.h macros.h thread_annotations.h; do
            fetch "$raw/MaDeG/libbase-ndk/$LIBBASE_SHA/include/android-base/$f" "$CL/include/android-base/$f"
          done
          # Minimal NDK-only shims for the AOSP build-only dependencies of the client.
          printf '%s\n' \
            '#pragma once' \
            '#include <string>' \
            'namespace fmt { template <typename... Args> inline std::string format(const std::string& f, Args&&...) { return f; } }' \
            '#define FMT_STRING(x) x' > "$CL/include/android-base/format.h"
          cat > "$CL/include/android-base/logging.h" <<'EOF'
          #pragma once
          #include <errno.h>
          #include <string.h>
          #include <sstream>
          #include <android/log.h>
          namespace android { namespace base {
          enum LogSeverity { VERBOSE, DEBUG, INFO, WARNING, ERROR, FATAL };
          class LogMessage {
           public:
            LogMessage(LogSeverity s, const char*, int) : severity_(s) {}
            ~LogMessage() {
              __android_log_print(severity_ >= ERROR ? ANDROID_LOG_ERROR :
                                  (severity_ == WARNING ? ANDROID_LOG_WARN : ANDROID_LOG_INFO),
                                  "crosvm-display-client", "%s", stream_.str().c_str());
            }
            std::ostream& stream() { return stream_; }
           private:
            LogSeverity severity_; std::ostringstream stream_;
          };
          }}
          #define LOG(severity) ::android::base::LogMessage(::android::base::severity, __FILE__, __LINE__).stream()
          #define PLOG(severity) ::android::base::LogMessage(::android::base::severity, __FILE__, __LINE__).stream() << " (" << strerror(errno) << ")"
          EOF
          cat > "$CL/include/cutils/trace.h" <<'EOF'
          #pragma once
          #define ATRACE_TAG_GRAPHICS 0
          #define ATRACE_TAG_ALWAYS 0
          #define ATRACE_ENABLED() false
          #define ATRACE_BEGIN(name) ((void)0)
          #define ATRACE_END() ((void)0)
          #define ATRACE_INT64(name, value) ((void)0)
          #define ATRACE_INT(name, value) ((void)0)
          #define ATRACE_ASYNC_BEGIN(name, cookie) ((void)0)
          #define ATRACE_ASYNC_END(name, cookie) ((void)0)
          EOF
          # The NDK backend of the runner's newest aidl emits calls newer than NDK r27c's
          # libbinder_ndk headers. Pin build-tools r35, whose generated code matches r27c.
          if [ ! -f downloads/build-tools_r35_linux.zip ]; then
            aria2c -x16 -s16 -d downloads -o build-tools_r35_linux.zip https://dl.google.com/android/repository/build-tools_r35_linux.zip
          fi
          unzip -q -o downloads/build-tools_r35_linux.zip -d "$CL/build-tools"
          AIDL=$(find "$CL/build-tools" -name aidl -type f | head -1)
          test -n "$AIDL"
          AIDL_VERSION=$("$AIDL" --version 2>&1 || true)
          printf '%s\n' "$AIDL_VERSION" | grep -q 'platform SDK version 35'
          "$AIDL" --lang=ndk -I "$CL/aidl" -o "$CL/aidl-out" --header_out="$CL/aidl-hdr" \
            "$CL/aidl/android/crosvm/ICrosvmAndroidDisplayService.aidl" "$CL/aidl/android/crosvm/DisplayConfig.aidl"
          CXX="$TC/bin/aarch64-linux-android35-clang++"
          CFLAGS="-std=c++20 -DANDROID -O2 -fPIC -I$CL/include -I$CL/src -I$CL/aidl-hdr"
          for f in crosvm_android_display_client media_codec_dl surface_control_dl; do
            "$CXX" $CFLAGS -c "$CL/src/$f.cpp" -o "$CL/obj/$f.o"
          done
          for f in ICrosvmAndroidDisplayService DisplayConfig; do
            "$CXX" $CFLAGS -c "$CL/aidl-out/android/crosvm/$f.cpp" -o "$CL/obj/$f.o"
          done
          "$TC/bin/llvm-ar" rcs "$CL/libcrosvm_android_display_client.a" "$CL"/obj/*.o
          # Link-time import stubs: the platform-only binder/nativewindow entry points are not in
          # the NDK stub .so files but exist on the device; keep their real sonames and the exact
          # version nodes so the runtime binds to the platform libraries.
          python3 -I - <<'PY'
          import collections, os, pathlib, subprocess
          cl = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'native-display-client'
          nm = os.environ['TC'] + '/bin/llvm-nm'
          sdk = os.environ['TC'] + '/sysroot/usr/lib/aarch64-linux-android/35'
          def symbol_versions(so):
              out = subprocess.check_output([nm, '-D', '--defined-only', sdk + '/' + so], text=True)
              m = {}
              for line in out.splitlines():
                  parts = line.split()
                  if len(parts) >= 3 and parts[1] in ('T', 'W', 'i'):
                      name, _, version = parts[2].partition('@@')
                      m[name] = version
              return m
          def undefined_symbols(archive):
              out = subprocess.check_output([nm, '-u', '--format=just-symbols', str(archive)], text=True)
              return sorted({line.strip() for line in out.splitlines() if line.strip()})
          binder = symbol_versions('libbinder_ndk.so')
          native = symbol_versions('libnativewindow.so')
          platform_only = {
              'ABinderProcess_setThreadPoolMaxThreadCount': ('binder', 'LIBBINDER_NDK'),
              'ABinderProcess_startThreadPool': ('binder', 'LIBBINDER_NDK'),
              'AServiceManager_addService': ('binder', 'LIBBINDER_NDK'),
              'ANativeWindowBuffer_getHardwareBuffer': ('native', 'LIBNATIVEWINDOW'),
              'ANativeWindow_cancelBuffer': ('native', 'LIBNATIVEWINDOW'),
              'ANativeWindow_dequeueBuffer': ('native', 'LIBNATIVEWINDOW'),
              'ANativeWindow_queueBuffer': ('native', 'LIBNATIVEWINDOW'),
              'ANativeWindow_setBuffersTimestamp': ('native', 'LIBNATIVEWINDOW'),
              'ANativeWindow_setUsage': ('native', 'LIBNATIVEWINDOW'),
          }
          pairs = {'binder': [], 'native': []}
          for name in undefined_symbols(cl / 'libcrosvm_android_display_client.a'):
              if name in binder:
                  pairs['binder'].append((name, binder[name]))
              elif name in native:
                  pairs['native'].append((name, native[name]))
              elif name in platform_only:
                  library, version = platform_only[name]
                  pairs[library].append((name, version))
          assert len(pairs['binder']) > 20 and len(pairs['native']) > 5, {k: len(v) for k, v in pairs.items()}
          for library, soname in (('binder', 'libbinder_ndk.so'), ('native', 'libnativewindow.so')):
              grouped = collections.OrderedDict()
              for name, version in pairs[library]:
                  grouped.setdefault(version, []).append(name)
              (cl / 'linkstubs' / (library + '_stub.c')).write_text(
                  ''.join('void %s(void) {}\n' % name for name, _ in pairs[library]))
              (cl / 'linkstubs' / (library + '.map')).write_text(
                  ''.join('%s { global: %s; local: *; };\n' % (version, '; '.join(names))
                          for version, names in grouped.items()))
              print(library, soname, len(pairs[library]), list(grouped))
          PY
          for stub in binder native; do
            soname=libbinder_ndk.so
            [ "$stub" = native ] && soname=libnativewindow.so
            "$TC/bin/aarch64-linux-android35-clang" -shared -fPIC -Wl,-soname,$soname \
              -Wl,--version-script="$CL/linkstubs/$stub.map" \
              -o "$CL/linkstubs/$soname" "$CL/linkstubs/${stub}_stub.c"
          done
          "$TC/bin/llvm-nm" -D --defined-only "$CL/linkstubs/libbinder_ndk.so" | head -3
          ls -l "$CL/libcrosvm_android_display_client.a" "$CL/linkstubs"

      - name: Cargo build crosvm (aarch64-linux-android)
        shell: bash
        run: |
          set -euxo pipefail
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/bin/aarch64-linux-android33-clang"
          export CC_aarch64_linux_android="$TC/bin/aarch64-linux-android33-clang"
          export CXX_aarch64_linux_android="$TC/bin/aarch64-linux-android33-clang++"
          export AR_aarch64_linux_android="$TC/bin/llvm-ar"
          export CFLAGS_aarch64_linux_android="-I$PWD/native-headers"
          export MINIJAIL_BINDGEN_TARGET=aarch64-linux-android33
          export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$TC/sysroot"
          export PKG_CONFIG_PATH="$PWD/native-prefix/lib/pkgconfig"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-L native=$GITHUB_WORKSPACE/native-libs -L native=$GITHUB_WORKSPACE/out -C link-arg=-Wl,-rpath,\$ORIGIN/../lib -C link-arg=-Wl,--whole-archive -C link-arg=$GITHUB_WORKSPACE/native-display-client/libcrosvm_android_display_client.a -C link-arg=-Wl,--no-whole-archive -C link-arg=$GITHUB_WORKSPACE/native-display-client/linkstubs/libbinder_ndk.so -C link-arg=$GITHUB_WORKSPACE/native-display-client/linkstubs/libnativewindow.so -C link-arg=$TC/sysroot/usr/lib/aarch64-linux-android/libc++_static.a -C link-arg=$TC/sysroot/usr/lib/aarch64-linux-android/libc++abi.a"
          cd source
          cargo +"$RUSTUP_TOOLCHAIN" build --locked --release --target aarch64-linux-android \
            --no-default-features \
            --features 'gpu,virgl_renderer,gunyah,qcow,net,config-file,balloon,android_display' \
            2>&1 | tee ../cargo-build.log

      - name: Verify and package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p evidence/runtime/bin evidence/runtime/lib out-artifact
          cp source/target/aarch64-linux-android/release/crosvm out-artifact/crosvm
          "$TC/bin/llvm-objcopy" --only-keep-debug out-artifact/crosvm out-artifact/crosvm.debug
          "$TC/bin/llvm-strip" --strip-debug out-artifact/crosvm
          cp out/libvirglrenderer.so out-artifact/libvirglrenderer.so
          "$TC/bin/llvm-readelf" -h -d out-artifact/crosvm > evidence/crosvm-elf.txt
          "$TC/bin/llvm-readelf" -h -d out-artifact/libvirglrenderer.so > evidence/virglrenderer-elf.txt
          grep -q 'Machine:.*AArch64' evidence/crosvm-elf.txt
          grep -q 'AArch64' evidence/virglrenderer-elf.txt
          strings out-artifact/crosvm | grep -i virglrenderer | sort -u > evidence/crosvm-virgl-strings.txt
          test -s evidence/crosvm-virgl-strings.txt
          "$TC/bin/llvm-readelf" -d out-artifact/crosvm | grep NEEDED || true
          ( cd out-artifact && sha256sum crosvm libvirglrenderer.so | tee SHA256SUMS )
          cp source-commit.txt evidence/source-commit.txt
          cp cargo-build.log evidence/cargo-build.log || true
          printf 'Android API33 aarch64 crosvm, features gpu,virgl_renderer,gunyah,qcow,net,config-file,balloon,android_display. Linked against the Mali kbase virglrenderer built by scripts/host-ndk/build-host-ndk.sh. Not runtime-tested by CI.\n' > evidence/scope.txt
          ls -l out-artifact

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crosvm-panvk-${{ github.run_id }}
          path: |
            out-artifact/
            evidence/
          if-no-files-found: error
          retention-days: 30
