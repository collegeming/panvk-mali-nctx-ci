name: build-guest-panvk-icd-retry
on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: mesa-manet commit to build
        required: false
        default: 57e402a2edb0c67fa5302c85e506d48f086b2cd2
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Checkout CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential meson ninja-build python3-mako python3-yaml pkg-config bison flex \
            libdrm-dev libudev-dev libwayland-dev wayland-protocols libx11-dev libxext-dev \
            libxrandr-dev libxfixes-dev libxcb1-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-sync-dev libxcb-shm0-dev libxcb-xfixes0-dev libexpat1-dev zlib1g-dev \
            libzstd-dev libelf-dev libvulkan-dev glslang-tools xxd libllvmspirvlib-18-dev libclang-18-dev libclang-cpp18-dev libclang-common-18-dev
      - name: Install newer Meson in a venv
        run: |
          set -eux
          python3 -m venv "$HOME/meson-venv"
          "$HOME/meson-venv/bin/pip" install -q --upgrade pip
          "$HOME/meson-venv/bin/pip" install -q 'meson>=1.4,<2' mako pyyaml packaging
          echo "$HOME/meson-venv/bin" >> "$GITHUB_PATH"
      - name: Checkout experimental Mesa PanVK
        uses: actions/checkout@v4
        with:
          repository: MollySophia/mesa-manet
          ref: ${{ inputs.mesa_ref }}
          path: mesa
          fetch-depth: 1
          persist-credentials: false
      - name: Fix include names in experimental transport
        run: |
          set -eux
          sed -i 's|kmod/kbase_virtio.h|kmod/mali_kbase_virtio.h|g' \
            mesa/src/panfrost/vulkan/csf/panvk_vX_gpu_queue.c \
            mesa/src/panfrost/vulkan/panvk_device_memory.c
      - name: Retry a fresh control-page blob when a recycled BAR offset reads stale
        if: ${{ false }}
        run: |
          set -eux
          python3 - <<'PY'
          import pathlib

          p = pathlib.Path("mesa/src/panfrost/lib/kmod/mali_kbase_virtio.c")
          lines = p.read_text().splitlines(keepends=True)

          start = next(i for i, l in enumerate(lines)
                       if "struct drm_virtgpu_context_set_param params[2]" in l)
          end = next(i for i, l in enumerate(lines)
                     if "*ctx = (struct kbv_ctx){.fd = fd, .gem = blob.bo_handle, .shm = shm};" in l)
          assert start < end, "unexpected transport layout"

          new = """   struct drm_virtgpu_context_set_param params[2] = {{1, 6}, {2, 1}};
             struct drm_virtgpu_context_init init = {.num_params = 2, .ctx_set_params = (uintptr_t)params};
             struct drm_virtgpu_resource_create_blob blob;
             struct drm_virtgpu_map map;
             void *shm = MAP_FAILED;
             /* A recycled BAR offset can map a page that still holds the previous context's
              * control page: the host re-registers the offset, but the guest's view of that
              * page does not follow. Keep every rejected blob allocated so the kernel hands
              * out a fresh range next time, and stop at the first page whose header reads
              * back as the host wrote it (rsp_mem_offset == 8). */
             for (unsigned attempt = 0; attempt < 8; attempt++) {
                /* A context owns at most one shmem blob, so a fresh attempt needs a fresh
                 * context; the previous one stays alive and keeps its range allocated. */
                if (ioctl(fd, DRM_IOCTL_VIRTGPU_CONTEXT_INIT, &init)) goto fail;
                memset(&blob, 0, sizeof(blob));
                blob.blob_mem = VIRTGPU_BLOB_MEM_HOST3D;
                blob.blob_flags = VIRTGPU_BLOB_FLAG_USE_MAPPABLE;
                blob.size = 4096;
                if (ioctl(fd, DRM_IOCTL_VIRTGPU_RESOURCE_CREATE_BLOB, &blob)) goto fail;
                memset(&map, 0, sizeof(map));
                map.handle = blob.bo_handle;
                shm = MAP_FAILED;
                if (!ioctl(fd, DRM_IOCTL_VIRTGPU_MAP, &map))
                   shm = mmap(NULL, 4096, PROT_READ | PROT_WRITE, MAP_SHARED, fd, map.offset);
                if (shm != MAP_FAILED && ((volatile uint32_t *)shm)[1] == 8)
                   break;
                if (shm != MAP_FAILED)
                   fprintf(stderr, "kbase virtio: stale control page at 0x%llx, retrying\\n",
                           (unsigned long long)map.offset);
                shm = MAP_FAILED;
             }
             if (shm == MAP_FAILED) goto fail;
             /* The context has to be recorded before returning: every request goes through
              * rpc(), which looks the fd up in `contexts`. Leaving this out makes the blob
              * appear built and mapped while every request fails with ENODEV. */
             *ctx = (struct kbv_ctx){.fd = fd, .gem = blob.bo_handle, .shm = shm};
          """
          # Re-indent the replacement: the first line keeps 3 spaces, the rest 3+3.
          body = new.splitlines(keepends=True)
          body = [body[0]] + ["   " + l for l in body[1:]]
          lines[start:end + 1] = body
          p.write_text("".join(lines))
          print("patched mali_kbase_virtio.c")
          PY
          sed -n '/struct drm_virtgpu_resource_create_blob blob;/,/^   \*ctx = (struct kbv_ctx)/p' mesa/src/panfrost/lib/kmod/mali_kbase_virtio.c | head -40
      - name: Instrument the transport init path
        if: ${{ false }}
        run: |
          set -eux
          python3 - <<'PY'
          import pathlib

          p = pathlib.Path("mesa/src/panfrost/lib/kmod/mali_kbase_virtio.c")
          s = p.read_text()

          def rep(old, new):
              global s
              assert old in s, old[:70]
              s = s.replace(old, new, 1)

          rep('      errno = ENODEV; return -1;\n   }',
              '      fprintf(stderr, "kbv: caps fail fd=%d caps=[%u,%u,%u,%u,%u,%u]\\n", fd, caps[0], caps[1], caps[2], caps[3], caps[4], caps[5]);\n      errno = ENODEV; return -1;\n   }\n   fprintf(stderr, "kbv: caps ok fd=%d v%u.%u\\n", fd, caps[1], caps[2]);')

          rep('   if (!ctx) { errno = EMFILE; goto fail; }',
              '   if (!ctx) { fprintf(stderr, "kbv: no free ctx slot\\n"); errno = EMFILE; goto fail; }')

          rep('if (ioctl(fd, DRM_IOCTL_VIRTGPU_CONTEXT_INIT, &init)) goto fail;',
              'if (ioctl(fd, DRM_IOCTL_VIRTGPU_CONTEXT_INIT, &init)) { fprintf(stderr, "kbv: ctxinit fd=%d errno=%d\\n", fd, errno); goto fail; }')

          rep('if (ioctl(fd, DRM_IOCTL_VIRTGPU_RESOURCE_CREATE_BLOB, &blob)) goto fail;',
              'if (ioctl(fd, DRM_IOCTL_VIRTGPU_RESOURCE_CREATE_BLOB, &blob)) { fprintf(stderr, "kbv: blob fd=%d errno=%d\\n", fd, errno); goto fail; }')

          rep('if (shm != MAP_FAILED && ((volatile uint32_t *)shm)[1] == 8)',
              'fprintf(stderr, "kbv: map fd=%d off=0x%llx shm=%p hdr=[%u,%u]\\n", fd, (unsigned long long)map.offset, shm, shm != MAP_FAILED ? ((volatile uint32_t *)shm)[0] : 0xffffffffu, shm != MAP_FAILED ? ((volatile uint32_t *)shm)[1] : 0xffffffffu);\n                if (shm != MAP_FAILED && ((volatile uint32_t *)shm)[1] == 8)')

          rep('*ctx = (struct kbv_ctx){.fd = fd, .gem = blob.bo_handle, .shm = shm};',
              '*ctx = (struct kbv_ctx){.fd = fd, .gem = blob.bo_handle, .shm = shm};\n             fprintf(stderr, "kbv: ready fd=%d gem=%u shm=%p\\n", fd, blob.bo_handle, shm);')

          rep('   if (!ctx) { errno = ENODEV; goto out; }',
              '   if (!ctx) { fprintf(stderr, "kbv: rpc no ctx fd=%d\\n", fd); errno = ENODEV; goto out; }')

          rep('   if (shm[1] != 8) { errno = EPROTO; goto out; }',
              '   if (shm[1] != 8) { fprintf(stderr, "kbv: bad page fd=%d shm1=%u\\n", fd, shm[1]); errno = EPROTO; goto out; }')

          p.write_text(s)
          print("instrumented mali_kbase_virtio.c")
          PY
          grep -n 'kbv:' mesa/src/panfrost/lib/kmod/mali_kbase_virtio.c
      - name: Instrument the device-init path
        run: |
          set -eux
          python3 scripts/panvk-icd-diagnostics.py mesa
      - name: Instrument device creation
        run: |
          set -eux
          python3 scripts/panvk-icd-devcreate.py mesa
      - name: Support same-device virtio dma-buf reimport
        run: |
          set -eux
          python3 - <<'PY'
          from pathlib import Path
          def replace(p, old, new):
              s = p.read_text()
              assert s.count(old) == 1, (str(p), old[:80], s.count(old))
              p.write_text(s.replace(old, new))
          p = Path('mesa/src/panfrost/lib/kmod/kbase_kmod.c')
          old = '''{
             return kbase_kmod_import_dmabuf(dev, NULL, fd, size, 0, true);
          }'''
          new = '''{
             if (kbv_has(dev->fd)) {
                uint32_t gem = 0;
                if (drmPrimeFDToHandle(dev->fd, fd, &gem))
                   return NULL;
                struct kbase_kmod_dev *kdev =
                   container_of(dev, struct kbase_kmod_dev, base);
                uint32_t limit = p_atomic_read(&kdev->next_handle);
                /* pan_kmod_bo_import holds handle_to_bo.lock. Synthetic kbase
                 * handles are not GEM handles: compare the transport identity. */
                for (uint32_t i = 1; i <= limit; ++i) {
                   struct pan_kmod_bo **slot =
                      util_sparse_array_get(&dev->handle_to_bo.array, i);
                   if (!slot || !*slot)
                      continue;
                   struct kbase_kmod_bo *candidate =
                      container_of(*slot, struct kbase_kmod_bo, base);
                   if (candidate->virtio_gem != gem)
                      continue;
                   if (size != (*slot)->size) {
                      errno = EINVAL;
                      return NULL;
                   }
                   /* The generic import path takes the reference. */
                   return *slot;
                }
                /* Foreign contexts need a host import protocol, not a guest fd.
                 * This new GEM handle is ours; existing handles above are not. */
                drmCloseBufferHandle(dev->fd, gem);
                mesa_loge("kbase virtio: dma-buf has no BO in this device");
                errno = ENOTSUP;
                return NULL;
             }
             return kbase_kmod_import_dmabuf(dev, NULL, fd, size, 0, true);
          }'''
          replace(p, old, new)
          old = '''   if (kbase_bo->virtio_handle) {
                kbv_bo_free'''
          new = '''   if (kbase_bo->virtio_handle) {
                if (kbase_bo->dmabuf_fd >= 0)
                   close(kbase_bo->dmabuf_fd);
                kbv_bo_free'''
          replace(p, old, new)
          p = Path('mesa/src/panfrost/lib/kmod/pan_kmod.c')
          old = '''      assert(*slot == NULL);
                *slot = bo;
                goto out_unlock;'''
          new = '''      /* An fd backend may resolve an existing BO while this lock is
                 * held, just like the GEM-handle path below. */
                if (*slot == bo) {
                   p_atomic_inc(&bo->refcnt);
                } else {
                   assert(*slot == NULL);
                   *slot = bo;
                }
                goto out_unlock;'''
          replace(p, old, new)
          p = Path('mesa/src/panfrost/lib/kmod/kbase_kmod.c')
          marker = 'static int\nkbase_kmod_bo_export_fd(struct pan_kmod_bo *bo)'
          helper = '''int
          kbase_kmod_sync_exported(struct pan_kmod_dev *dev)
          {
             if (!kbv_has(dev->fd)) return 0;
             struct kbase_kmod_dev *kdev = container_of(dev, struct kbase_kmod_dev, base);
             int ret = 0;
             simple_mtx_lock(&dev->handle_to_bo.lock);
             uint32_t limit = p_atomic_read(&kdev->next_handle);
             for (uint32_t i = 1; i <= limit; ++i) {
                struct pan_kmod_bo **slot = util_sparse_array_get(&dev->handle_to_bo.array, i);
                if (!slot || !*slot) continue;
                struct kbase_kmod_bo *bo = container_of(*slot, struct kbase_kmod_bo, base);
                if (!bo->virtio_handle || bo->dmabuf_fd < 0) continue;
                if (kbv_bo_sync(dev->fd, bo->virtio_handle, 0, bo->base.size,
                                BASE_SYNCSET_OP_CSYNC)) {
                   ret = -1;
                   break;
                }
             }
             simple_mtx_unlock(&dev->handle_to_bo.lock);
             return ret;
          }

          '''
          replace(p, marker, helper + marker)
          p = Path('mesa/src/panfrost/lib/kmod/kbase_kmod.h')
          p.write_text(p.read_text() + '\nint kbase_kmod_sync_exported(struct pan_kmod_dev *dev);\n')
          p = Path('mesa/src/panfrost/vulkan/panvk_physical_device.c')
          replace(p, '#include "panvk_device.h"', '#include "panvk_device.h"\n#include "kmod/mali_kbase_virtio.h"\n#include <xf86drm.h>')
          old = '''   /* Preferred path: a kernel sync_file produced by a KCPU queue that waits'''
          new = '''   /* The virtio transport cannot pass host KCPU fence fds to the guest.
              * Complete the GPU wait, then export a real guest sync-file from
              * a signaled DRM syncobj. This never reports unfinished work. */
             if (kbv_has(dev->kmod.dev->fd)) {
                struct vk_sync_wait wait = {.sync = sync, .wait_value = 0};
                VkResult result = kbase_cpu_sync_wait_many(device, 1, &wait,
                   VK_SYNC_WAIT_COMPLETE, UINT64_MAX);
                if (result != VK_SUCCESS)
                   return result;
                if (kbase_kmod_sync_exported(dev->kmod.dev))
                   return vk_errorf(device, VK_ERROR_DEVICE_LOST,
                                    "virtio exported BO readback failed");
                uint32_t handle = 0;
                int fd = -1;
                int ret = drmSyncobjCreate(dev->kmod.dev->fd,
                   DRM_SYNCOBJ_CREATE_SIGNALED, &handle);
                if (ret)
                   return vk_errorf(device, VK_ERROR_OUT_OF_HOST_MEMORY,
                                    "virtio syncobj create failed: %d", ret);
                ret = drmSyncobjExportSyncFile(dev->kmod.dev->fd, handle, &fd);
                drmSyncobjDestroy(dev->kmod.dev->fd, handle);
                if (ret || fd < 0)
                   return vk_errorf(device, VK_ERROR_OUT_OF_HOST_MEMORY,
                                    "virtio sync-file export failed: %d", ret);
                *sync_file = fd;
                return VK_SUCCESS;
             }

             /* Preferred path: a kernel sync_file produced by a KCPU queue that waits'''
          replace(p, old, new)
          PY
          git -C mesa diff --check
      - name: Elide redundant seqno-cell invalidates (B0.2)
        run: |
          set -eux
          python3 scripts/panvk-b02-cpu-sync.py mesa
          git -C mesa diff --check
          git -C mesa diff --stat
          git -C mesa diff -- src/panfrost/vulkan/csf/panvk_vX_gpu_queue.c
      - name: Build PanVK with kbase virtio kmod
        run: |
          set -eux
          cd mesa
          meson setup build \
            -Dbuildtype=release -Dwerror=false \
            -Dvulkan-drivers=panfrost -Dgallium-drivers= \
            -Dpanfrost-kmds=kbase \
            -Dplatforms=wayland -Dglx=disabled -Degl=disabled \
            -Dgles1=disabled -Dgles2=disabled
          ninja -C build -j"$(nproc)"
          find build -name 'libvulkan_manet.so*' -ls
      - name: Stage ICD payload
        run: |
          set -eux
          mkdir -p out
          lib=$(find mesa/build -name 'libvulkan_manet.so*' | head -1)
          test -n "$lib"
          cp "$lib" out/libvulkan_manet.so
          cat > out/panvk_icd.json <<'JSON'
          {
            "file_format_version": "1.0.0",
            "ICD": {
              "library_path": "/opt/panvk/libvulkan_manet.so",
              "api_version": "1.3.0"
            }
          }
          JSON
          sha256sum out/libvulkan_manet.so | tee out/SHA256SUMS
          grep -ac 'stale control page' out/libvulkan_manet.so || true
          # The device-side G probe needs the raw offset of the
          # kbase_subqueue_wait_seqno copy the arch actually runs (six copies
          # exist, perf probe by name is ambiguous), so publish the table.
          readelf -sW out/libvulkan_manet.so > out/symbols.raw || true
          grep -E 'kbase_subqueue_wait_seqno|kbv_bo_sync|kbv_queue_kick' \
            out/symbols.raw | tee out/SYMBOLS.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: panvk-icd-b02-${{ github.run_id }}
          path: out/
